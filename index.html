<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il fiore sul pozzo - Gioco Finale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-card {
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; color: #f59e0b; margin-bottom: 8px; }
    p.subtitle { font-size: 0.9rem; color: #9ca3af; margin-bottom: 24px; }
    .box-info {
      background: #111827;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .stato-testo { font-size: 1rem; font-weight: bold; color: #38bdf8; min-height: 24px; }
    .tentativi-testo { font-size: 0.85rem; color: #ef4444; margin-top: 6px; font-weight: bold; }
    .btn-azione {
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }
    .btn-azione:disabled { background: #4b5563; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Il fiore sul pozzo</h1>
    <p class="subtitle">Escape Room Vocale Finale</p>

    <div class="box-info">
      <div class="stato-testo" id="txt-stato">Premi il pulsante per iniziare</div>
      <div class="tentativi-testo" id="txt-tentativi">Tentativi rimasti: 3</div>
    </div>

    <button class="btn-azione" id="btn-start" onclick="avviaGara()">AVVIA L'ENIGMA</button>
  </div>

  <script>
    const CHIAVE_CORRETTA = "fiore"; // Parola segreta da indovinare
    let vite = 3;
    let giocoAttivo = false;

    function parlaInItaliano(testo, alTermine) {
      window.speechSynthesis.cancel();
      const messaggio = new SpeechSynthesisUtterance(testo);
      messaggio.lang = 'it-IT';
      messaggio.rate = 0.9;
      messaggio.onend = () => { if (alTermine) alTermine(); };
      window.speechSynthesis.speak(messaggio);
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let ascoltatore = null;

    if (SpeechRec) {
      ascoltatore = new SpeechRec();
      ascoltatore.lang = 'it-IT';
      ascoltatore.continuous = false;
      ascoltatore.interimResults = false;

      ascoltatore.onstart = () => {
        impostaStato("In ascolto... Parla ora!");
      };

      ascoltatore.onresult = (e) => {
        const detto = e.results[0][0].transcript.toLowerCase().trim();
        impostaStato('Hai detto: "' + detto + '"');
        controllaRisposta(detto);
      };

      ascoltatore.onerror = (e) => {
        if (e.error === 'no-speech') {
          parlaInItaliano("Non ho sentito la risposta. Riprova.", () => attivaMicrofono());
        } else {
          impostaStato("Errore microfono: " + e.error);
        }
      };
    } else {
      alert("Microfono non supportato dal browser. Usa Chrome o Edge.");
    }

    function avviaGara() {
      if (!giocoAttivo) {
        vite = 3;
        giocoAttivo = true;
        document.getElementById("btn-start").disabled = true;
        aggiornaVite();

        impostaStato("Ascolta il messaggio...");
        parlaInItaliano("Benvenuto nell'enigma finale de Il fiore sul pozzo. Hai tre tentativi per pronunciare la parola segreta. Qual è la tua risposta?", () => {
          attivaMicrofono();
        });
      }
    }

    function attivaMicrofono() {
      try {
        ascoltatore.start();
      } catch (err) {
        console.log("Microfono già aperto");
      }
    }

    function controllaRisposta(testo) {
      if (testo.includes(CHIAVE_CORRETTA)) {
        impostaStato("RISPOSTA CORRETTA!");
        parlaInItaliano("Complimenti! Hai detto la parola corretta e sbloccato il finale!");
        chiudiGioco("HAI VINTO! GIOCA ANCORA");
      } else {
        vite--;
        aggiornaVite();

        if (vite > 0) {
          parlaInItaliano("Risposta errata. Ti rimangono " + vite + " tentativi. Riprova!", () => {
            attivaMicrofono();
          });
        } else {
          impostaStato("GAME OVER");
          parlaInItaliano("Hai esaurito tutti i tentativi. L'enigma rimane irrisolto.");
          chiudiGioco("RIPROVA IL GIOCO");
        }
      }
    }

    function chiudiGioco(testoTasto) {
      giocoAttivo = false;
      const b = document.getElementById("btn-start");
      b.disabled = false;
      b.innerText = testoTasto;
    }

    function impostaStato(t) {
      document.getElementById("txt-stato").innerText = t;
    }

    function aggiornaVite() {
      document.getElementById("txt-tentativi").innerText = "Tentativi rimasti: " + vite;
    }
  </script>
</body>
</html>
