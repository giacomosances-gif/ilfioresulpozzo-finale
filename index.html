<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il fiore sul pozzo - Enigma Finale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    h1 { font-size: 1.8rem; color: #f59e0b; margin-bottom: 8px; }
    p.subtitle { font-size: 0.95rem; color: #94a3b8; margin-bottom: 25px; font-style: italic; }
    .status-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      border: 1px solid #1e293b;
    }
    .status { font-size: 1.1rem; font-weight: bold; color: #38bdf8; min-height: 28px; }
    .attempts { font-size: 0.85rem; color: #f43f5e; margin-top: 8px; font-weight: bold; }
    button {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #ffffff;
      border: none;
      padding: 18px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Il fiore sul pozzo</h1>
    <p class="subtitle">L'Enigma Finale</p>

    <div class="status-box">
      <div class="status" id="txt-stato">Premi il pulsante per iniziare</div>
      <div class="attempts" id="txt-tentativi">Tentativi rimasti: 3</div>
    </div>

    <button id="btn-main" onclick="avviaGara()">ENTRA NEL POZZO</button>
  </div>

  <script>
    const LINK_VITTORIA = "https://youtu.be/-w9pIqTdfWY";
    const LINK_SCONFITTA = "https://youtu.be/PMo16Loz5r0";
    
    let tentativi = 3;
    let giocoAttivo = false;

    function parlaInItaliano(testo, alTermine) {
      window.speechSynthesis.cancel();
      const messaggio = new SpeechSynthesisUtterance(testo);
      messaggio.lang = 'it-IT';
      messaggio.rate = 0.9;
      
      let chiamato = false;
      messaggio.onend = () => {
        if (!chiamato && alTermine) { chiamato = true; alTermine(); }
      };
      
      // Timer di sicurezza se la sintesi vocale si blocca
      setTimeout(() => {
        if (!chiamato && alTermine) { chiamato = true; alTermine(); }
      }, 4000);

      window.speechSynthesis.speak(messaggio);
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let ascoltatore = null;

    if (SpeechRec) {
      ascoltatore = new SpeechRec();
      ascoltatore.lang = 'it-IT';
      ascoltatore.continuous = false;

      ascoltatore.onstart = () => {
        impostaStato("In ascolto... Parla ora!");
      };

      ascoltatore.onresult = (e) => {
        const detto = e.results[0][0].transcript.toLowerCase().trim();
        impostaStato('Hai detto: "' + detto + '"');
        valutaRisposta(detto);
      };

      ascoltatore.onerror = () => {
        if (giocoAttivo && tentativi > 0) {
          impostaStato("Non ho sentito. Riprova!");
          setTimeout(() => attivaMicrofono(), 1200);
        }
      };
    }

    function avviaGara() {
      if (!giocoAttivo) {
        tentativi = 3;
        giocoAttivo = true;
        document.getElementById("btn-main").disabled = true;
        aggiornaTentativi();

        impostaStato("Ascolta l'enigma...");
        parlaInItaliano("Benvenuto nell'enigma finale de Il fiore sul pozzo. Qual è la tua risposta?", () => {
          attivaMicrofono();
        });
      }
    }

    function attivaMicrofono() {
      try {
        ascoltatore.start();
      } catch (err) {}
    }

    function valutaRisposta(testo) {
      // Controlla se la frase detta contiene la parola 'luna'
      if (testo.includes("luna")) {
        impostaStato("RISPOSTA CORRETTA!");
        parlaInItaliano("Bravo! Risposta corretta.", () => {
          window.location.href = LINK_VITTORIA;
        });
      } else {
        tentativi--;
        aggiornaTentativi();

        if (tentativi > 0) {
          impostaStato("Risposta errata...");
          parlaInItaliano("Risposta errata. Riprova!", () => {
            attivaMicrofono();
          });
        } else {
          impostaStato("GAME OVER");
          parlaInItaliano("Hai perso. Verrai reindirizzato.", () => {
            window.location.href = LINK_SCONFITTA;
          });
        }
      }
    }

    function impostaStato(t) {
      document.getElementById("txt-stato").innerText = t;
    }

    function aggiornaTentativi() {
      document.getElementById("txt-tentativi").innerText = "Tentativi rimasti: " + tentativi;
    }
  </script>
</body>
</html>
